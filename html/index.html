<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- JS -->
    <script src="../js/app.js" defer></script>
    <title>JS Timing Function</title>
  </head>
  <body>
    <header>
      <h1 class="text-center p-2 bg-sky-400 text-2xl">JS Timing Function</h1>
    </header>
    <main class="change-bg-color my-4">
      <!-- Ex.2 -->
      <section class="text-center m-2">
        <p class="change-bg cursor-pointer border border-black">
          Change Background
        </p>
        <p class="text-hidden hidden mt-2 border border-black">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Error,
          reprehenderit! Possimus vitae nam quia odit nobis quibusdam explicabo
          modi repellat?
        </p>
      </section>

      <section class="text-center m-2 border border-black">
        <p class="mt-2 text-to-change">C'era una volta: Il Re Leone</p>
        <button
          class="change-text-btn rounded border border-black p-2 m-2 cursor-pointer bg-green-300"
        >
          Change text
        </button>
      </section>

      <section class="text-center m-2 border border-black rounded">
        <p class="mt-2 text-to-change-two">Pippo e Pluto vanno al mare</p>
        <button
          class="change-text-btn-two rounded border border-black p-2 m-2 cursor-pointer bg-purple-600 text-white"
        >
          Change text
        </button>
      </section>

      <section class="flex justify-center m-2">
        <p
          class="pt-10 text-center show-clock text-xl font-bold border-3 border-yellow-500 rounded-full w-30 h-30"
        ></p>
      </section>

      <section class="text-center m-2">
        <h2
          class="change-text-color cursor-pointer border border-black text-lg"
        >
          Title
        </h2>
      </section>

      <section class="text-center m-2">
        <p class="progress-bar bg-red-300 rounded"></p>
      </section>

      <section class="flex justify-center mt-4">
        <p
          class="pt-6 text-center show-random-number text-xl font-bold border-2 border-purple-500 rounded-full w-30 h-20"
        ></p>
      </section>
    </main>
  </body>
</html>
